# computational-rnd-engine CI
#
# Always-run software gates: pytest, ruff, compileall, determinism, schema validation
# EDA gates: when EDA/PDK is available; otherwise report BLOCKED_EXTERNAL_DEPENDENCY
#
# Honesty rule: CI never reports PASS for a stage that did not actually execute.

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  software-gates:
    name: "Software Gates (always-run)"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: compileall
        run: python -m compileall -q rnd_engine

      - name: ruff
        run: ruff check .

      - name: pytest
        run: pytest -q

  eda-doctor:
    name: "EDA Doctor"
    runs-on: ubuntu-latest
    needs: software-gates
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run EDA doctor (honest report)
        run: |
          rnd-engine eda-doctor --profile sky130 > eda_doctor_report.txt 2>&1 || true
          cat eda_doctor_report.txt
          # The doctor always exits 0 unless --strict is given.
          # In CI without EDA tools, we verify it reports BLOCKED/MISSING honestly.
          if grep -q "BLOCKED\|MISSING\|NOT_RUN" eda_doctor_report.txt; then
            echo "EDA_GATE_STATUS=BLOCKED_EXTERNAL_DEPENDENCY"
          else
            echo "EDA_GATE_STATUS=OPERATIONAL"
          fi

      - name: Upload doctor report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eda-doctor-report-${{ matrix.python-version }}
          path: eda_doctor_report.txt