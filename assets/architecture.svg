<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420" role="img" aria-label="COMPUTATIONAL R&amp;D ENGINE">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#22D3EE" fill-opacity="0.9"/>
    </marker>
    <linearGradient id="boxg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#151E33"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="420" fill="#0B0F19"/>
  <rect x="0.5" y="0.5" width="1279" height="419" fill="none" stroke="#1F2A44"/>
  <text x="40" y="44" fill="#8B94A7" font-family="ui-monospace, 'SFMono-Regular', 'Cascadia Code', Consolas, monospace" font-size="13" letter-spacing="2.5">COMPUTATIONAL R&amp;D ENGINE</text>
  <text x="40" y="68" fill="#E5E7EB" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="700">Generate, verify, evaluate, learn (per generation)</text>
  
  <rect x="60" y="150" width="165" height="74" rx="10" fill="url(#boxg)" stroke="#22D3EE" stroke-opacity="0.55" stroke-width="1.3"/><text x="142.5" y="183.0" fill="#E5E7EB" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle" dominant-baseline="middle">1 - Search</text><text x="142.5" y="202.0" fill="#8B94A7" font-family="ui-monospace, 'SFMono-Regular', 'Cascadia Code', Consolas, monospace" font-size="11" text-anchor="middle" dominant-baseline="middle">propose candidates</text>
  <rect x="278" y="150" width="165" height="74" rx="10" fill="url(#boxg)" stroke="#22D3EE" stroke-opacity="0.55" stroke-width="1.3"/><text x="360.5" y="183.0" fill="#E5E7EB" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle" dominant-baseline="middle">2 - Derive</text><text x="360.5" y="202.0" fill="#8B94A7" font-family="ui-monospace, 'SFMono-Regular', 'Cascadia Code', Consolas, monospace" font-size="11" text-anchor="middle" dominant-baseline="middle">spec -&gt; arch -&gt; uarch</text>
  <rect x="496" y="150" width="165" height="74" rx="10" fill="url(#boxg)" stroke="#A78BFA" stroke-opacity="0.55" stroke-width="1.3"/><text x="578.5" y="183.0" fill="#E5E7EB" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle" dominant-baseline="middle">3 - Verify</text><text x="578.5" y="202.0" fill="#8B94A7" font-family="ui-monospace, 'SFMono-Regular', 'Cascadia Code', Consolas, monospace" font-size="11" text-anchor="middle" dominant-baseline="middle">lint / sim / check</text>
  <rect x="714" y="150" width="165" height="74" rx="10" fill="url(#boxg)" stroke="#A78BFA" stroke-opacity="0.55" stroke-width="1.3"/><text x="796.5" y="183.0" fill="#E5E7EB" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle" dominant-baseline="middle">4 - Evaluate</text><text x="796.5" y="202.0" fill="#8B94A7" font-family="ui-monospace, 'SFMono-Regular', 'Cascadia Code', Consolas, monospace" font-size="11" text-anchor="middle" dominant-baseline="middle">deterministic surrogate</text>
  <rect x="932" y="150" width="165" height="74" rx="10" fill="url(#boxg)" stroke="#3B82F6" stroke-opacity="0.55" stroke-width="1.3"/><text x="1014.5" y="183.0" fill="#E5E7EB" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle" dominant-baseline="middle">5 - Archive</text><text x="1014.5" y="202.0" fill="#8B94A7" font-family="ui-monospace, 'SFMono-Regular', 'Cascadia Code', Consolas, monospace" font-size="11" text-anchor="middle" dominant-baseline="middle">best-of-N receipt</text>
  <line x1="225" y1="187" x2="276" y2="187" stroke="#22D3EE" stroke-width="1.8" stroke-opacity="0.85" marker-end="url(#arr)"/>
  <line x1="443" y1="187" x2="494" y2="187" stroke="#22D3EE" stroke-width="1.8" stroke-opacity="0.85" marker-end="url(#arr)"/>
  <line x1="661" y1="187" x2="712" y2="187" stroke="#22D3EE" stroke-width="1.8" stroke-opacity="0.85" marker-end="url(#arr)"/>
  <line x1="879" y1="187" x2="930" y2="187" stroke="#22D3EE" stroke-width="1.8" stroke-opacity="0.85" marker-end="url(#arr)"/>
  <path d="M 1015 224 C 1015 340, 140 340, 142 226" fill="none" stroke="#A78BFA" stroke-width="1.6" stroke-opacity="0.8" stroke-dasharray="6 6" marker-end="url(#arr)"/>
  <text x="620" y="366" fill="#8B94A7" font-family="ui-monospace, 'SFMono-Regular', 'Cascadia Code', Consolas, monospace" font-size="12" text-anchor="middle">knowledge accumulates -&gt; better candidates next generation</text>

</svg>
