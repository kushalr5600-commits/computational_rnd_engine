[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "computational-rnd-engine"
version = "0.1.0"
description = "Standalone CPU/GPU computational invention and design-space exploration engine centered on the Omega objective"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.7,<3", "numpy>=2.0,<3", "pyyaml>=6.0,<7"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.6,<1"]

[project.scripts]
rnd-engine = "rnd_engine.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["rnd_engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
# One-off operational/transform scripts from the EDA bring-up are not part of
# the shipped package; the engine (rnd_engine/) and tests stay fully linted.
extend-exclude = ["eda/scripts", "eda/pdk_downloads", "eda/sky130_smoke", "fix_arrays.py"]
